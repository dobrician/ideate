name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p data
      - run: npm run build
        env:
          DATABASE_URL: ${{ github.workspace }}/data/ideate.db
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: mkdir -p data && npm run build
        env:
          DATABASE_URL: ${{ github.workspace }}/data/ideate.db
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Start server and run smoke tests
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 30000
          npm run test:smoke
        env:
          DATABASE_URL: ${{ github.workspace }}/data/ideate.db
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NODE_ENV: production
          MAIL_LOG_FILE: /tmp/ideate-mail.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: mkdir -p data && npm run build
        env:
          DATABASE_URL: ${{ github.workspace }}/data/ideate.db
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Start server and run E2E tests
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 30000
          npx playwright test --project=chromium
        env:
          DATABASE_URL: ${{ github.workspace }}/data/ideate.db
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NODE_ENV: production
          MAIL_LOG_FILE: /tmp/ideate-mail.log
          E2E_TEST_SECRET: ci-e2e-test-secret
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-report
          path: playwright-report/
          retention-days: 7

  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cloudflare-deploy:
    name: Cloudflare Pages Deploy
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        run: |
          for sql_file in drizzle/*.sql; do
            if [ -f "$sql_file" ]; then
              npx wrangler d1 execute ideate-db --file="$sql_file" 2>/dev/null || true
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages
        env:
          NODE_ENV: production
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=ideate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
