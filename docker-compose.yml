services:
  staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ideate-staging
    ports:
      - "4100:3000"
    volumes:
      - ideate-data-staging:/app/data
      - /tmp/ideate-logs:/tmp/ideate-logs
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/ideate.db
      - MAIL_LOG_FILE=/tmp/ideate-logs/mail.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ideate-dev
    ports:
      - "4101:3000"
    volumes:
      - ideate-data-dev:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/ideate.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ideate-data-staging:
  ideate-data-dev:
