services:
  redis:
    image: redis:7-alpine
    container_name: ideate-redis
    ports:
      - "6379:6379"
    volumes:
      - ideate-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ideate-staging
    ports:
      - "4100:3000"
    volumes:
      - ideate-data-staging:/app/data
      - /tmp/ideate-logs:/tmp/ideate-logs
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/ideate.db
      - MAIL_LOG_FILE=/tmp/ideate-logs/mail.log
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ideate-dev
    ports:
      - "4101:3000"
    volumes:
      - ideate-data-dev:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/ideate.db
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ideate-redis-data:
  ideate-data-staging:
  ideate-data-dev:
