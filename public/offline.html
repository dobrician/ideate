<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ideate - Offline</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f9fafb;color:#111;padding:20px;}
    .container{text-align:center;max-width:400px;}
    h1{font-size:24px;margin-bottom:8px;}
    p{color:#666;margin-bottom:24px;}
    button{background:#0070f3;color:#fff;border:none;padding:12px 24px;border-radius:6px;font-size:14px;cursor:pointer;}
    button:hover{background:#0060d0;}
  </style>
</head>
<body>
  <div class="container">
    <h1>You're Offline</h1>
    <p>Ideate requires an internet connection. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
